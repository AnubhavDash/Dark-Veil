minimumReleaseAgeExclude:
  - '@next/*'
  - next

# Transitive advisories that no direct dependency bump can reach. Each one is a
# patch/minor with no API change; drop an entry once the parent ships it itself.
#   nanoid                  postcss (and @tailwindcss/postcss > postcss)
#   postcss-selector-parser tailwindcss internals
#
# `browserslist` used to be here for next > styled-jsx > @babel/core >
# helper-compilation-targets. Dropping the Gemini SDK took @babel/core out of the
# tree with it — styled-jsx only ever had it as an optional peer — so that chain,
# and the override, no longer resolve to anything.
overrides:
  nanoid: '>=3.3.18'
  postcss: '>=8.5.23'
  postcss-selector-parser: '>=7.1.3'
