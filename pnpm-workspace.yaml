minimumReleaseAgeExclude:
  - '@next/*'
  - next

# Transitive advisories that no direct dependency bump can reach. Each one is a
# patch/minor with no API change; drop an entry once the parent ships it itself.
#   browserslist            next > styled-jsx > @babel/core > helper-compilation-targets
#   nanoid                  postcss (and @tailwindcss/postcss > postcss)
#   postcss-selector-parser tailwindcss internals
overrides:
  browserslist: '>=4.28.7'
  nanoid: '>=3.3.18'
  postcss: '>=8.5.23'
  postcss-selector-parser: '>=7.1.3'
